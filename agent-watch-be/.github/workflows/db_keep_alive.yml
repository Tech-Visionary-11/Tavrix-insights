name: Database Keep Alive

on:
  schedule:
    # Run at 00:00 every day to prevent Supabase pausing (happens after 7 days inactivity)
    - cron: '0 0 * * *'
  workflow_dispatch:  # Allows manual triggering

jobs:
  ping-db:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11' 

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run keep-alive script
        env:
          # Make sure to add this secret in your GitHub repository settings
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/keep_alive.py
